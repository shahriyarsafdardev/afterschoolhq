				<h2 class="mg-md text-center blue-text">
					Tell us more
				</h2>
				<p class="text-center">
					This helps parents find you when searching
				</p>
				<div class="divider-h">
					<span class="divider"></span>
				</div>
				<div class="form-group">
					<label>
						What grades do you serve?<br>
					</label>
					<div class="row">
						<div class="col-lg-5">
							<select class="form-control grade-select" required id="sel-grade-start" data-validate-error="Select a grade">
								<option value="1">
									Option 2
								</option>
							</select>
						</div>
						<div class="col-lg-2 align-self-center">
							<p class="text-lg-center">
								To
							</p>
						</div>
						<div class="col-lg-5">
							<select class="form-control grade-select" id="sel-grade-end" required data-validate-error="Select a grade">
								<option value="0">
									Option 1
								</option>
								<option value="1">
									Option 2
								</option>
							</select>
						</div>
					</div>
				</div>
				<div class="form-group">
					<label>
						My program is designed for:
					</label>
					<div required required-count="1" data-validate-error="Select one option">
						<div class="form-check">
							<input class="form-check-input" type="radio" name="gender-restrictions" value="0" checked="checked" id="chk-gender-all" />
							<label class="form-check-label">
								All Genders
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="radio" name="gender-restrictions" value="1" id="chk-gender-boys" />
							<label class="form-check-label">
								Boys
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="radio" name="gender-restrictions" value="2" id="chk-gender-girls" />
							<label class="form-check-label">
								Girls
							</label>
						</div>
					</div>
				</div>
				<div class="form-group">
					<label>
						Services Offered (select at least one):<br>
					</label>
					<div required required-count="1" data-validate-error="Select at least one option" id="div-services-offered">
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-classes" />
							<label class="form-check-label">
								Classes
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-events" />

							</label>

						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-camps" />
							<label class="form-check-label">
								Camps
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-field-trips" />
							<label class="form-check-label">
								Field Trips
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-workshops" />
							<label class="form-check-label">
								Workshops
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-virtual-learning" />
							<label class="form-check-label">
								Virtual Learning
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-tutoring" />
							<label class="form-check-label">
								Tutoring
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-mentoring" />
							<label class="form-check-label">
								Mentoring
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-jobs" />
							<label class="form-check-label">
								Jobs
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-counseling" />
							<label class="form-check-label">
								Counseling
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-services-resources" />
							<label class="form-check-label">
								Resources
							</label>
						</div>
					</div>
				</div>
				<div class="form-group">
					<label>
						Pricing Details (check all that apply):<br>
					</label>
					<div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-free-available" />
							<label class="form-check-label">
								Free activities available
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-scholarships-available" />
							<label class="form-check-label">
								Scholarships available
							</label>
						</div>
					</div>
				</div>
				<div class="form-group">
					<label>
						My program offers (check all that apply):<br>
					</label>
					<div id="div-programs-offered">
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-after-school-programs" />
							<label class="form-check-label">
								After-school programs
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-before-school-programs" />
							<label class="form-check-label">
								Before-school programs
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-during-school-programs" />
							<label class="form-check-label">
								During-school programs
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-evening-programs" />
							<label class="form-check-label">
								Evening programs
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-weekend-programs" />
							<label class="form-check-label">
								Weekend programs
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="chk-summer-programs" />
							<label class="form-check-label">
								Summer programs
							</label>

					</div>

</div>
