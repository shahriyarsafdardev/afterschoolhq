<body>
<!-- Main container -->
<div class="page-container">
    
<!-- bloc-0 -->
<div class="bloc bgc-dark-cerulean bg-image-3 bloc-bg-texture texture-darken d-bloc" id="bloc-0">
	<div class="container bloc-sm">
		<div class="row">
			<div class="col-sm-10 offset-sm-1 col-md-8 offset-md-2 col-lg-6 offset-lg-3">
				<img src="img/ahq-logo.png" class="img-fluid mx-auto d-block" alt="ahq logo" />
			</div>
		</div>
	</div>
</div>
<!-- bloc-0 END -->

<!-- bloc-5 -->
<div class="bloc l-bloc" id="bloc-5">
	<div class="container bloc-sm">
		<div class="row">
			<div class="col-lg-4 offset-lg-4 col-sm-8 offset-sm-2">
				<h2 class="mg-md text-center blue-text">
					Contact Information
				</h2>
				<p class="text-lg-center text-sm-center text-center">
					How can parents contact you?
				</p><a href="sign-up-social.html" class="a-btn a-block text-lg-center input-description text-center">Skip >></a>
				<div class="divider-h">
					<span class="divider"></span>
				</div>
				<div class="form-group">
					<label>
						What email address should parents use?<br>
					</label>
					<input class="form-control" placeholder="(optional)" type="email" data-validate="email" data-validate-error="Enter a valid email address" id="txt-program-email" />
					<label class="input-description">
						ex: email@domain.com<br>
					</label>
				</div>
				<div class="form-group">
					<label>
						Do you have a website?<br>
					</label>
					<input class="form-control" placeholder="(optional)" data-validate="url" data-validate-error="Enter a valid url" id="txt-program-website" />
					<label class="input-description">
						ex: https://www.yourwebsite.com/<br>
					</label>
				</div>
				<div class="form-group">
					<label>
						What number should parents call?&nbsp;<br>
					</label>
					<input class="form-control" placeholder="(optional)" data-validate="phone" data-validate-error="Enter a valid phone number" id="txt-program-phone" />
					<label class="input-description">
						Should be your 10 digit phone number. ex: 317-316-0596<br>
					</label>
				</div>
				<div class="form-group">
					<label>
						Do you want your phone number publicly available?
					</label>
					<div required required-count="1">
						<div class="form-check">
							<input class="form-check-input" type="radio" name="public-phone" value="option1" id="rad-phone-public-yes" />
							<label class="form-check-label">
								Yes
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="radio" name="public-phone" value="option1" checked="checked" id="rad-phone-public-no" />
							<label class="form-check-label">
								No
							</label>
						</div>
					</div>
				</div><a href="sign-up-social.html" class="btn btn-block btn-persian-green btn-xl margin-v-40" id="btn-submit" button-action="program-contact">Continue ><br></a>
				<div><div class="progress mb-3">
  <div class="progress-bar" role="progressbar" style="width: 60%; background-color: rgb(0, 81, 124);" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">60%</div>
</div>
				</div><a href="javascript:history.go(-1)" class="a-btn a-block text-lg-center text-center">&lt; Back</a>
			</div>
		</div>
	</div>
</div>
<!-- bloc-5 END -->

<!-- ScrollToTop Button -->
<a class="bloc-button btn btn-d scrollToTop" onclick="scrollToTarget('1',this)"><span class="fa fa-chevron-up"></span></a>
