    <title>Sign Up</title>

<body>
<!-- Main container -->
<div class="page-container">
    
<!-- bloc-0 -->
<div class="bloc bgc-dark-cerulean bg-image-3 bloc-bg-texture texture-darken d-bloc" id="bloc-0">
	<div class="container bloc-sm">
		<div class="row">
			<div class="col-sm-10 offset-sm-1 col-md-8 offset-md-2 col-lg-6 offset-lg-3">
				<img src="img/ahq-logo.png" class="img-fluid mx-auto d-block" alt="ahq logo" />
			</div>
		</div>
	</div>
</div>
<!-- bloc-0 END -->

<!-- bloc-0 -->
<div class="bloc l-bloc" id="bloc-0">
	<div class="container bloc-sm">
		<div class="row">
			<div class="col-lg-4 offset-lg-4 col-sm-8 offset-sm-2">
				<h2 class="mg-md text-center blue-text">
					Tell us about you
				</h2>
				<p class="text-lg-center text-md-center text-center">
					Let&rsquo;s get your account started. <br>Please fill in the information below
				</p>
				<div class="divider-h">
					<span class="divider"></span>
				</div>
				<div class="form-group">
					<label>
						First Name
					</label>
					<input class="form-control" required id="txt-firstname" maxlength="50" data-validate-error="Enter your first name" />
				</div>
				<div class="form-group">
					<label>
						Last Name
					</label>
					<input class="form-control" required id="txt-lastname" maxlength="50" data-validate-error="Enter your last name" />
				</div>
				<div class="form-group">
					<label>
						Email Address
					</label>
					<input class="form-control" type="email" data-error-validation-msg="Enter a valid email address" required id="txt-email" maxlength="100" data-validate-error="Enter a valid email address" on-blur-validation="SignUpProcess.checkEmailAvailability('txt-email')" />
					<p class="input-description">
						ex: email@domain.com
					</p>
				</div><a href="sign-up-personal-organization.html" class="btn btn-block btn-persian-green btn-xl margin-v-40" id="btn-submit" button-action="personal-info">Continue ></a>
				<div><div class="progress mb-3">
  <div class="progress-bar" role="progressbar" style="width: 0%; background-color: rgb(0, 81, 124);" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
</div>
				</div><a href="javascript:history.go(-1)" class="a-btn a-block text-lg-center text-center">&lt; Back</a>
			</div>
		</div>
	</div>
</div>
<!-- bloc-0 END -->

<!-- ScrollToTop Button -->
<a class="bloc-button btn btn-d scrollToTop" onclick="scrollToTarget('1',this)"><span class="fa fa-chevron-up"></span></a>
<!-- ScrollToTop Button END-->


</div>
<!-- Main container END -->
    

<!-- Additional JS -->
<script src="./js/jquery-3.3.1.min.js?2415"></script>
<script src="./js/bootstrap.bundle.min.js?153"></script>
<script src="./js/blocs.min.js?5604"></script>
<script src="./js/lazysizes.min.js" defer></script>
<script src="./js/app-custom.js?8542"></script>
<!-- Additional JS END -->



<!-- Preloader -->
<div id="page-loading-blocs-notifaction" class="page-preloader"></div>
<!-- Preloader END -->

</body>
</html>
