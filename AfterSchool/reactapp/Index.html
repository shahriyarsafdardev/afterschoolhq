<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link href="https://fonts.googleapis.com/css?family=Montserrat&display=swap&subset=latin,latin-ext" rel="stylesheet" type="text/css" />
        <link href="../Content/googleTranslate.css" rel="stylesheet" type="text/css" />
        <title>AfterSchool HQ</title>
        <style>
            .react_body {
                position: unset !important;
            }
        </style>
    </head>
    <body class="react_body">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root" style="height: 100%"></div>
        <div id="google_translate_element"></div>

        <script src="/React/dist/bundle.js"></script>

        <script type="text/javascript">
            function googleTranslateElementInit() {
                new google.translate.TranslateElement({ pageLanguage: "en", includedLanguages: "en,es,fr,ht,sw" }, "google_translate_element");
            }
        </script>
        <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </body>
</html>
