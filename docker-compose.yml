version: "3"

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2019-latest
    user: root
    ports:
      - "1433:1433"
    volumes:
      - sql-server-data:/var/opt/mssql/data
      - ./scripts/sql:/scripts/setup
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=testing123!
      - MSSQL_PID=Developer
  influxdb:
    image: influxdb:1.8-alpine
    ports:
      - "8086:8086"
    volumes:
      - "influxdb-data:/var/lib/influxdb"
      - "/etc/influxdb/scripts:/docker-entrypoint-initdb.d"
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=true
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana
volumes:
  sql-server-data:
  influxdb-data:
  grafana-data: