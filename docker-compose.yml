version: "3"

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2019-latest
    user: root
    profiles: ["mssql"]
    ports:
      - "1433:1433"
    volumes:
      - sql-server-data:/var/opt/mssql/data
      - ./scripts/sql:/scripts/setup
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=testing123!
      - MSSQL_PID=Developer
  influxdb:
    image: influxdb:2.2-alpine
    ports:
      - "8086:8086"
    volumes:
      - "influxdb-data:/var/lib/influxdb"
      - "/etc/influxdb/scripts:/docker-entrypoint-initdb.d"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=afterschoolhq
      - DOCKER_INFLUXDB_INIT_BUCKET=local
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana
volumes:
  sql-server-data:
  influxdb-data:
  grafana-data: