variables:
  - name: BuildParameters.solution
    value: AfterSchoolHQ - Darye.sln
trigger: none
pr: none # Disable triggering a build on every pull request.
resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/main
jobs:
  - job: Job_1
    displayName: Agent job 1
    pool:
      vmImage: windows-latest
    steps:
      - checkout: self
        clean: true
      - script: |
          cd AfterSchool/React
          echo "ENVIRONMENT=$(Environment)" >> .env
          echo SMART_LOOK_KEY=$(SmartLookKey) >> .env
          echo GOOGLE_MAPS_API_KEY=$(GoogleMapsApiKey) >> .env
          echo ROLLBAR_CLIENT_KEY=$(RollbarClientKey) >> .env
          echo GTM_ID=$(GtmID) >> .env
          echo $(SMART_LOOK_KEY)
          echo $(SMART_LOOK_KEYS)
          echo $(GTM_ID)
          cat .env
        env:
          Environment: $(ENVIRONMENT)
          SMART_LOOK_KEY: $(SMART_LOOK_KEY)
          GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
          ROLLBAR_CLIENT_KEY: $(ROLLBAR_CLIENT_KEY)
          GTM_ID: $(GTM_ID)
        displayName: 'Set environment variables'
      - task: NodeTool@0
        inputs:
          versionSource: 'spec'
          versionSpec: '16.0'
      - task: Npm@1
        inputs:
          command: 'install'
          workingDir: 'AfterSchool/React'
      - task: Npm@1
        inputs:
          command: 'custom'
          workingDir: 'AfterSchool/React'
          customCommand: 'run build'
      - task: NuGetToolInstaller@1
        displayName: Use NuGet
        inputs:
          checkLatest: true
      - task: NuGetCommand@2
        displayName: NuGet restore
        inputs:
          solution: $(BuildParameters.solution)
      - task: VSBuild@1
        displayName: Build solution
        inputs:
          solution: $(BuildParameters.solution)
          msbuildArgs: /p:DeployOnBuild=true /p:DeployDefaultTarget=WebPublish /p:WebPublishMethod=FileSystem /p:publishUrl="$(Pipeline.Workspace)\\publish"
          platform: $(BuildPlatform)
          configuration: $(BuildConfiguration)
      - task: VSTest@2
        displayName: Isolated Tests
        inputs:
          testAssemblyVer2: >-
            **\*.Tests.dll
            
            !**\*TestAdapter.dll
            
            !**\obj\**
          codeCoverageEnabled: false
          publishRunAttachments: false
      - task: PublishPipelineArtifact@1
        displayName: Publish Pipeline Artifact
        inputs:
          path: $(Pipeline.Workspace)\publish
          artifactName: AfterSchoolHQ-Pipeline-Artifact
      
