variables:
  - name: BuildParameters.solution
    value: AfterSchoolHQ - Darye.sln
  npm_config_cache: $(Pipeline.Workspace)/.npm
trigger: none
pr: none # Disable triggering a build on every pull request.
resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/main
jobs:
  - job: Job_1
    displayName: Agent job 1
    pool:
      vmImage: windows-latest
    steps:
      - checkout: self
        clean: true
      - task: UseNode@1
        inputs:
          version: '16.0.0'
      - script: |
          cd AfterSchool/React
          echo SMART_LOOK_KEY=$(SMART_LOOK_KEY) >> .env
          echo GOOGLE_MAPS_API_KEY=$(GOOGLE_MAPS_API_KEY) >> .env
          echo ROLLBAR_CLIENT_KEY=$(ROLLBAR_CLIENT_KEY) >> .env
          echo GTM_ID=$(GTM_ID) >> .env
        displayName: 'Set environment variables'
      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | AfterSchool/React/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(npm_config_cache)
        displayName: Cache npm
      - script: |
          cd AfterSchool/React
          npm ci
        displayName: 'NPM Install Packages'
      - task: Npm@1
        inputs:
          command: 'custom'
          workingDir: 'AfterSchool/React'
          customCommand: 'run build'
      - task: PowerShell@2
        displayName: Update index.html
        inputs:
          targetType: 'inline'
          script: |
            $commitSHA = git rev-parse HEAD
            $indexFile = Get-Content -Path AfterSchool\reactapp\index.html
            $updatedIndexFile = $indexFile -replace '{{COMMIT_SHA}}', $commitSHA
            $updatedIndexFile | Set-Content -Path AfterSchool\reactapp\index.html
      - task: NuGetToolInstaller@1
        displayName: Use NuGet
        inputs:
          checkLatest: true
      - task: NuGetCommand@2
        displayName: NuGet restore
        inputs:
          solution: $(BuildParameters.solution)
      - task: VSBuild@1
        displayName: Build solution
        inputs:
          solution: $(BuildParameters.solution)
          msbuildArgs: /p:DeployOnBuild=true /p:DeployDefaultTarget=WebPublish /p:WebPublishMethod=FileSystem /p:publishUrl="$(Pipeline.Workspace)\\publish"
          platform: $(BuildPlatform)
          configuration: $(BuildConfiguration)
      - task: VSTest@2
        displayName: Isolated Tests
        inputs:
          testAssemblyVer2: >-
            **\*.Tests.dll

            !**\*TestAdapter.dll

            !**\obj\**
          codeCoverageEnabled: false
          publishRunAttachments: false
      - task: PublishPipelineArtifact@1
        displayName: Publish Pipeline Artifact
        inputs:
          path: $(Pipeline.Workspace)\publish
          artifactName: AfterSchoolHQ-Pipeline-Artifact
